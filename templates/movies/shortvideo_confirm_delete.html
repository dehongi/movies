{% extends 'base.html' %}

{% block title %}Delete Short Video{% endblock %}

{% block content %}
<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h2 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>Confirm Delete</h2>
                </div>
                <div class="card-body">
                    <p class="lead">Are you sure you want to delete this short video?</p>

                    <div class="alert alert-warning">
                        <strong>{{ short_video.title }}</strong>
                    </div>

                    <p class="text-muted">This action cannot be undone.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash me-2"></i>Yes, Delete
                            </button>
                            <a href="{% url 'movies:shortvideo_detail' short_video.pk %}" class="btn btn-secondary">
                                <i class="fas fa-times me-2"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
